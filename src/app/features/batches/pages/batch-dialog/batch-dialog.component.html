<p-dialog
  [closable]="true"
  [closeOnEscape]="true"
  [header]="isEdit() ? (viewMode() ? 'Batch Details' : 'Edit Batch') : 'Create New Batch'"
  [modal]="true"
  [style]="{ width: '800px' }"
  [visible]="visible()"
  (onHide)="onCancel()"
  (visibleChange)="visibleChange.emit($event)"
>
  <ng-template pTemplate="content">
    <form class="batch-form" [formGroup]="batchForm">

      <!-- Product Selection -->
      <div class="field">
        <app-select
          id="product"
          [control]="batchForm.controls.productId"
          [label]="'Product *'"
          [options]="productOptions()"
          [placeholder]="'Select a product'"
          [showClear]="true"
        />
      </div>

      <!-- Quantity -->
      <div class="field">
        <app-number-input
          id="quantity"
          [control]="batchForm.controls.quantity"
          [disabled]="viewMode()"
          [label]="'Quantity *'"
          [maxFractionDigits]="0"
          [min]="1"
          [placeholder]="'Enter quantity'"
        />
      </div>

      <!-- Production Date -->
      <div class="field">
        <label for="productionDate">Production Date</label>
        <p-date-picker
          class="form-calendar w-full"
          [formControl]="batchForm.controls.productionDate"
          [id]="'productionDate'"
          [placeholder]="'Select production date'"
          [showIcon]="true"
        />
      </div>

      <!-- Expiry Date -->
      <div class="field">
        <label for="expiryDate">Expiry Date</label>
        <p-date-picker
          class="form-calendar w-full"
          [formControl]="batchForm.controls.expiryDate"
          [id]="'expiryDate'"
          [placeholder]="'Select expiry date'"
          [showIcon]="true"
        />
      </div>

      <!-- Manufacturing Location -->
      <div class="field">
        <app-select
          id="manufacturingLocation"
          [control]="batchForm.controls.manufacturingLocation"
          [label]="'Manufacturing Location'"
          [options]="[
            { label: 'Main Centre', value: 'Main Centre' },
            { label: 'Gumo', value: 'Gumo' },
            { label: 'Katariga', value: 'Katariga' },
            { label: 'Malshegu', value: 'Malshegu' },
            { label: 'Other', value: 'Other' }
          ]"
          [placeholder]="'Select manufacturing location'"
          [showClear]="true"
        />
      </div>

      <!-- Quality Check Status -->
      <div class="field">
        <app-input
          id="qualityCheckStatus"
          [control]="batchForm.controls.qualityCheckStatus"
          [label]="'Quality Check Status'"
          [placeholder]="'Enter quality check status'"
          [readonly]="viewMode()"
        />
      </div>

      <!-- Notes -->
      <div class="field">
        <app-textarea
          id="notes"
          [control]="batchForm.controls.notes"
          [label]="'Notes'"
          [placeholder]="'Enter additional notes'"
          [rows]="3"
        />
      </div>
    </form>
  </ng-template>

  <ng-template pTemplate="footer">
    <p-button
      icon="pi pi-times"
      label="Cancel"
      severity="secondary"
      (onClick)="onCancel()"
    />
    @if (!viewMode()) {
      <p-button
        icon="pi pi-check"
        label="Save"
        [loading]="loading()"
        (onClick)="onSave()"
      />
    }
  </ng-template>
</p-dialog>
