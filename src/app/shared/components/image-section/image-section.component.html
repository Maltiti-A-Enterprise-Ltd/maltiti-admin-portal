<div class="form-section">
  <h3 class="section-title">Images</h3>
  <div class="form-grid">
    <div class="form-field full-width">
      <label class="form-label" for="image">Primary Image</label>
      @if (!viewMode()) {
        <p-fileupload
          accept="image/*"
          chooseLabel="Choose Primary Image"
          class="image-upload"
          id="image"
          maxFileSize="5000000"
          mode="basic"
          (onSelect)="onPrimaryImageUpload($event)"
        />
      }
      @if (primaryImageControl()?.value) {
        <div class="image-preview">
          <img alt="Primary image" class="preview-image" [src]="primaryImageControl()?.value" />
          <input
            class="image-url-input"
            pInputText
            readonly
            type="text"
            [value]="primaryImageControl()?.value"
          />
          @if (!viewMode()) {
            <button
              aria-label="Remove primary image"
              class="image-remove"
              pTooltip="Remove this image"
              type="button"
              (click)="removePrimaryImage()"
            >
              <i aria-hidden="true" class="pi pi-trash"></i>
            </button>
          }
        </div>
      }
    </div>

    <div class="form-field full-width">
      <label class="form-label" for="images">Additional Images</label>
      @if (!viewMode()) {
        <p-fileupload
          accept="image/*"
          chooseLabel="Choose Images"
          class="image-upload"
          id="images"
          maxFileSize="5000000"
          mode="basic"
          multiple="true"
          (onSelect)="onAdditionalImagesUpload($event)"
        />
      }
      @if (additionalImagesControl()?.value && additionalImagesControl()?.value.length > 0) {
        <div class="images-preview">
          <!-- Tracked by index, not by URL: the same image can legitimately
               be added twice, and tracking by value would collapse them. -->
          @for (imageUrl of additionalImagesControl()?.value; track $index) {
            <div class="image-item">
              <img alt="Product image" class="preview-image" [src]="imageUrl" />
              <input
                class="image-url-input"
                pInputText
                readonly
                type="text"
                [value]="imageUrl"
              />
              @if (!viewMode()) {
                <button
                  aria-label="Remove this image"
                  class="image-remove"
                  pTooltip="Remove this image"
                  type="button"
                  (click)="removeAdditionalImage($index)"
                >
                  <i aria-hidden="true" class="pi pi-trash"></i>
                </button>
              }
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>
