<header class="header">
  <div class="header-left">
    <p-button
      icon="pi pi-bars"
      severity="secondary"
      [rounded]="true"
      [text]="true"
      (onClick)="onToggleSidebar()"
    />
    <!-- The brand on a phone, where the green rail is hidden in the drawer.
         On a desktop the rail already says whose tool this is. -->
    <a aria-label="Maltiti dashboard" class="header-brand" routerLink="/dashboard">
      <img alt="" class="header-logo" src="/assets/images/maltiti-logo.png" width="309" />
      <span class="header-brand-name">Maltiti</span>
    </a>
  </div>

  <div class="header-right">
    <app-notification-panel />

    <!-- User Menu -->
    <!-- appendTo="body" so the menu escapes the header's stacking context.
         The header is sticky with z-index 100, which caps anything inside it
         below the bottom tab bar at 1000 — Logout ended up underneath it. -->
    <p-menu #userMenu appendTo="body" [model]="userMenuItems()" [popup]="true" />
    <!-- A button, so the menu opens from the keyboard too. The initials used
         to test `avatarUrl` without calling it — always truthy — so anyone
         without a photo got an empty blue circle. -->
    <button
      aria-haspopup="menu"
      class="header-avatar"
      type="button"
      [attr.aria-label]="'Account menu for ' + (fullName() || 'you')"
      (click)="userMenu.toggle($event)"
    >
      <p-avatar
        shape="circle"
        styleClass="header-avatar-image"
        [image]="avatarUrl() || undefined"
        [label]="avatarUrl() ? undefined : userInitials() || undefined"
      />
    </button>
  </div>
</header>
